  positive:
    - "Full Stack"
    - "Full-Stack"
    - "Fullstack"
    - "Lead Engineer"
    - "Lead Developer"
    - "Lead Software"
    - "Tech Lead"
    - "Technical Lead"
    - "Team Lead"
    - "Engineering Lead"
    - "Software Architect"
    - "Solution Architect"
    - "Solutions Architect"
    - "Application Architect"
    - "Staff Engineer"
    - "Staff Software"
    - "Principal Engineer"
    - "Senior Software Engineer"
    - "Senior Software Developer"
    - "Senior Frontend"
    - "Senior Backend"
    - "Senior Java"
    - "Senior Angular"
    - "React Native"
    - "Senior Mobile"
    - "Softwarearchitekt"
    - "Software-Architekt"
    - "Applikationsarchitekt"
    - "Lösungsarchitekt"
    - "Lead Entwickler"
    - "Senior Softwareentwickler"
    - "Senior Software Entwickler"
    - "Fullstack Entwickler"
    - "Full-Stack Entwickler"
    - "Java Entwickler"
    - "Angular Entwickler"
    - "Engineering Manager"
  negative:
    - "Junior"
    - "word:Intern"
    - "word:Interns"
    - "Internship"
    - "Werkstudent"
    - "Praktikant"
    - "Praktikum"
    - "Lernende"
    - "Lehrstelle"
    - ".NET"
    - "C#"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "SAP "
    - "ABAP"
    - "Salesforce"
    - "Mainframe"
    - "COBOL"
    - "Data Scientist"
    - "Research Scientist"

