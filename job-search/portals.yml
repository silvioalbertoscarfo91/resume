# Portal Scanner Configuration — Silvio Alberto Scarfò
# Scope: Switzerland (hybrid ≤ 2–3 office days) + fully remote worldwide (Switzerland eligible).
# Full reference of every option: templates/portals.example.yml in the career-ops repo.

scan_history:
  recheck_after_days: 30

