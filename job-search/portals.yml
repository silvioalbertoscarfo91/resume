    - "Switzerland"
    - "Schweiz"
    - "Suisse"
    - "Svizzera"
    - "Bern"
    - "Berne"
    - "Zurich"
    - "Zürich"
    - "Basel"
    - "Luzern"
    - "Lucerne"
    - "Zug"
    - "Fribourg"
    - "Biel"
    - "Solothurn"
    - "Thun"
    - "Aarau"
    - "Olten"
    - "Baden"
    - "Winterthur"
    - "St. Gallen"
    - "Lausanne"
    - "Geneva"
    - "Genève"
    - "Lugano"
    - "Remote - Europe"
    - "Remote (Europe)"
    - "EMEA"
    - "Worldwide"
    - "Anywhere"
