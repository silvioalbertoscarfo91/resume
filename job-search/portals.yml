    - "Remote"
    - "Europe"
    - "CET"
  block:
    - "United States"
    - "USA"
    - "Canada"
    - "India"
    - "Brazil"
    - "Australia"
    - "Singapore"
    - "Japan"

# WebSearch-driven queries (level 3). These are the main discovery path when
# direct ATS APIs are not reachable. Results are unconfirmed until checked at
# the employer (AGENTS.md → Aggregator Listings).
search_queries:
  - name: CH - Lead / Architect Java Angular (Bern)
    query: '("Lead Developer" OR "Tech Lead" OR "Software Architect" OR "Softwarearchitekt") (Java OR Angular OR "Spring Boot") Bern'
    enabled: true
  - name: CH - Senior Fullstack Java Angular (Bern)
    query: '("Senior Fullstack" OR "Senior Full-Stack" OR "Senior Software Engineer") Java Angular "Spring Boot" Bern'
    enabled: true
  - name: CH - Senior Fullstack / Lead (Zurich, Basel, Lucerne, Zug)
    query: '("Lead Engineer" OR "Tech Lead" OR "Senior Fullstack" OR "Software Architect") (Java OR Angular OR React) (Zürich OR Basel OR Luzern OR Zug) hybrid'
    enabled: true
  - name: CH - Solution / Application Architect
    query: '("Solution Architect" OR "Applikationsarchitekt" OR "Lösungsarchitekt") (Java OR AWS OR Kafka) Schweiz'
    enabled: true
  - name: CH - React Native senior / lead
    query: '("React Native") (Senior OR Lead) Schweiz OR Switzerland job'
    enabled: true
  - name: CH - ATS boards (Greenhouse / Lever / Ashby / SmartRecruiters / Workday)
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io OR site:jobs.lever.co OR site:jobs.ashbyhq.com OR site:jobs.smartrecruiters.com OR site:myworkdayjobs.com ("Senior" OR "Lead" OR "Staff") (Fullstack OR "Full Stack" OR Java OR Angular) (Zurich OR Bern OR Switzerland)'
    enabled: true
  - name: Remote - Europe full-stack lead (Java / TypeScript)
    query: 'site:boards.greenhouse.io OR site:jobs.lever.co OR site:jobs.ashbyhq.com ("Staff" OR "Lead" OR "Senior") ("Full Stack" OR Fullstack) (Java OR Kotlin OR TypeScript) "Remote" (Europe OR EMEA OR Switzerland)'
    enabled: true
  - name: Remote - Switzerland
    query: '("Senior" OR "Lead") ("Full Stack" OR "Software Engineer" OR "Architect") (Java OR Angular OR React) "100% remote" OR "fully remote" Switzerland'
    enabled: true
  - name: AI-native / agentic engineering
    query: '("Senior" OR "Lead") ("AI Engineer" OR "Agentic" OR "AI-native") (Java OR TypeScript) (Switzerland OR Zurich OR Bern OR "Remote Europe")'
    enabled: true

tracked_companies:

  # -- Bern region (public sector, federal suppliers, consultancies) --
  - name: Swisscom
    careers_url: https://www.swisscom.ch/en/about/career.html
    scan_method: websearch
    scan_query: 'Swisscom ("Senior" OR "Lead" OR "Architect") (Java OR Angular OR "Full Stack") job'
    notes: "Bern / Zurich. Large IT employer, hybrid common."
    enabled: true

  - name: Die Post / PostFinance
    careers_url: https://www.post.ch/en/jobs
    scan_method: websearch
